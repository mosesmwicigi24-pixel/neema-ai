name: Build & Push

# CI builds both images and pushes them to GHCR. It does NOT deploy — the VPS
# pulls new images itself on a systemd timer (scripts/box-deploy.sh), because
# this box's host firewall intermittently drops GitHub-runner IPs on port 22,
# which made an Actions->box SSH push unreliable. Outbound-from-box pulls are
# not affected, so the box-pull model is robust. Deploy lands within ~2 min of
# a successful push here.
#
# GATED: since the box pulls whatever lands in GHCR:latest, the image push IS
# the deploy. So nothing is built for main until the CI workflow is green — see
# the `ci` job below and docs/CI.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "EMERGENCY ONLY — build and push without running the CI gate"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/mosesmwicigi24-pixel/neema-ai-api
  WEB_IMAGE: ghcr.io/mosesmwicigi24-pixel/neema-ai-web
  NEXT_PUBLIC_API_URL: https://neema.bethanyhouse.co.ke/api
  NEXT_PUBLIC_WS_URL: ws://neema.bethanyhouse.co.ke

permissions:
  contents: read
  packages: write

jobs:
  # The quality gate, reused verbatim from ci.yml so there is exactly one copy
  # of the job definitions. Skipped on pull_request because ci.yml already runs
  # itself on the `pull_request` event — re-calling it here would double every
  # PR check. Skipped on a workflow_dispatch with skip_tests: true.
  ci:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_tests)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: [ci]
    # `always()` lets the build proceed when the gate was deliberately skipped
    # (PR builds, emergency dispatch) while still blocking on failure OR
    # cancellation — anything that is not success/skipped stops the image.
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PRs build only (proves the Dockerfiles still work); push and
      # workflow_dispatch actually publish, which is what the box picks up.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
