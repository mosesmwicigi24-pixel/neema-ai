name: Android

# Builds and tests the Android app (apps/android). On pull requests it proves
# the app compiles, passes its unit + screenshot tests, and attaches the APKs
# as a build artifact. On main it also publishes the APKs as a GitHub Release,
# which is how the app is "deployed" (sideload / MDM) — no Play Store needed.
#
# Signing: when the repository secrets ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set,
# release APKs are signed with that production key. Otherwise they are signed
# with the committed development key (apps/android/keystore/dev.jks), so every
# build still installs over the previous one.

on:
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # Paparazzi needs a 21+ JVM; the app still targets Java 17 bytecode

      - uses: gradle/actions/setup-gradle@v4

      - name: Production signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "NEEMA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # verifyPaparazziDebug runs every unit test AND compares each rendered
      # screen with its golden image (plain testDebugUnitTest only renders).
      - name: Unit + screenshot tests
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon

      - name: Build APKs
        env:
          NEEMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEEMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEEMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/paparazzi/failures/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: neema-android-apks
          path: apps/android/app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="android-v${version}-${GITHUB_RUN_NUMBER}"
          cd app/build/outputs/apk/release
          for f in *.apk; do mv "$f" "neema-${version}-${f#app-}"; done
          gh release create "$tag" *.apk \
            --title "Neema Android ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Install \`neema-${version}-arm64-v8a-release.apk\` on almost any modern phone (\`universal\` works everywhere). Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
