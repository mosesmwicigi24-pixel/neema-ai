name: CI

# The quality gate. Runs on every pull request (including every push to a PR
# branch — that's the `synchronize` event), AND is called by deploy.yml
# (workflow_call) as the gate in front of the GHCR image push — so a red suite
# means no image is ever built for main.
#
# Why no bare `push:` trigger. Between `pull_request` here and deploy.yml
# calling this workflow on main, every commit that can ship is already covered.
# Adding `push` on top makes every PR commit fire this workflow TWICE (once per
# event); they then either both run (double the minutes, duplicate checks) or
# share a concurrency group and cancel each other — which leaves a cancelled,
# red-looking check on the PR. Measured, not assumed: the first version of this
# file had `push: branches-ignore: [main]` and did exactly that.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Supersede in-flight runs for the same ref. `github.workflow` is part of the
# key on purpose: inside a reusable call it resolves to the CALLER's name
# ("Build & Push"), so a standalone CI run can never cancel the deploy gate.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── The suite ─────────────────────────────────────────────────────────────
  # 717 tests, no external services: every DB/Redis touchpoint in tests/ is a
  # hand-rolled fake. tests/test_migrations.py is the one exception and skips
  # itself here (DATABASE_URL_SYNC deliberately points at nothing) — the
  # `migrations` job below runs it for real against a live Postgres.
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # matches apps/api/Dockerfile
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # `python -m pytest`, never bare `pytest`: there is no pyproject/pytest.ini
      # and no conftest.py, so only the `-m` form puts apps/api on sys.path.
      # Bare `pytest` fails to import `app` in all 89 test modules.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://neema:neema@127.0.0.1:5432/neema
          DATABASE_URL_SYNC: postgresql+psycopg2://neema:neema@127.0.0.1:5432/neema
          SECRET_KEY: ci-not-a-real-secret
        run: python -m pytest -q -rs

  # ── Crash-loop guard ──────────────────────────────────────────────────────
  # The container CMD is `alembic upgrade head && uvicorn app.main:app`. A bad
  # import takes production down on the next box pull. Its own job so the
  # failure reason is unmistakable, and installed from requirements.txt (NOT
  # -dev) so it exercises exactly the dependency set the runtime image ships.
  import-smoke:
    name: Import smoke (crash-loop guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install runtime dependencies only
        run: pip install -r requirements.txt

      - name: import app.main
        env:
          DATABASE_URL: postgresql+asyncpg://neema:neema@127.0.0.1:5432/neema
          DATABASE_URL_SYNC: postgresql+psycopg2://neema:neema@127.0.0.1:5432/neema
          SECRET_KEY: ci-not-a-real-secret
        run: python -c "import app.main; print('app.main imported OK')"

  # ── Migration guard ───────────────────────────────────────────────────────
  # Second half of the crash-loop story: `alembic upgrade head` runs before
  # uvicorn, so a split head or a broken revision is equally fatal. The single
  # -head assertion needs no database at all; the replay test creates a throw
  # away database, runs the real chain end to end, and then diffs every model
  # column against the migrated schema.
  migrations:
    name: Migrations (single head + fresh-DB replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neema
          POSTGRES_PASSWORD: neema
          POSTGRES_DB: neema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # `alembic heads` reads the versions directory only — it never opens a
      # connection and never executes env.py, so this needs no env vars.
      - name: Assert exactly one alembic head
        run: |
          out=$(python -m alembic heads)
          echo "$out"
          n=$(printf '%s\n' "$out" | grep -c '(head)')
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $n — merge the branches before this can deploy"
            exit 1
          fi
          echo "single head OK"

      - name: Fresh-DB replay + model/schema drift
        env:
          DATABASE_URL: postgresql+asyncpg://neema:neema@localhost:5432/neema
          DATABASE_URL_SYNC: postgresql+psycopg2://neema:neema@localhost:5432/neema
          SECRET_KEY: ci-not-a-real-secret
        # test_migrations.py skips itself when Postgres is unreachable, which
        # would turn a broken service container into a silent green. Assert the
        # test actually executed.
        run: |
          python -m pytest tests/test_migrations.py -q -rs | tee /tmp/mig.log
          if ! grep -q "1 passed" /tmp/mig.log; then
            echo "::error::the migration replay test did not run (Postgres unreachable?) — treating as failure"
            exit 1
          fi

  # ── Lint ratchet ──────────────────────────────────────────────────────────
  # apps/api has no ruff config, so this is ruff's default rule set (E4/E7/E9/F).
  # There is a standing backlog of findings; the gate is only that the number
  # must never GROW. See docs/CI.md for how to lower the baseline.
  lint-ratchet:
    name: Lint ratchet (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.6.9        # pinned to apps/api/requirements-dev.txt

      - name: Compare finding count against the committed baseline
        run: |
          baseline=$(head -n 1 .ci/ruff-baseline.txt | tr -dc '0-9')
          if [ -z "$baseline" ]; then
            echo "::error::.ci/ruff-baseline.txt does not contain a number"
            exit 1
          fi
          cd apps/api
          ruff check . --output-format=json > /tmp/ruff.json || true
          current=$(python -c "import json;print(len(json.load(open('/tmp/ruff.json'))))")

          {
            echo "### Ruff ratchet"
            echo ""
            echo "baseline \`$baseline\` → current \`$current\`"
            echo ""
            echo '```'
            ruff check . --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ruff findings: baseline=$baseline current=$current"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::ruff findings went UP ($baseline -> $current). Fix the new ones, or see docs/CI.md."
            ruff check . --output-format=concise || true
            exit 1
          fi
          if [ "$current" -lt "$baseline" ]; then
            echo "::notice::ruff findings went DOWN ($baseline -> $current). Please lower .ci/ruff-baseline.txt to $current."
          fi
          echo "ratchet OK"

  # ── Frontend ──────────────────────────────────────────────────────────────
  # Mirrors apps/web/Dockerfile: node 20, pnpm, --frozen-lockfile, and the same
  # NEXT_PUBLIC_* values baked in by deploy.yml (they are compiled into the
  # bundle, so a build without them is not the build that ships).
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20                 # matches apps/web/Dockerfile
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://neema.bethanyhouse.co.ke/api
          NEXT_PUBLIC_WS_URL: ws://neema.bethanyhouse.co.ke
        run: pnpm run build
