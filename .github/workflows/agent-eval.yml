name: Agent eval (model in the loop)

# Runs the behavioural eval (apps/api/app/jobs/agent_eval.py) — the scripted
# customer conversations AND the audit's experience set (Judas, Willy, Pastor
# Emmanuel, the seven statements) — through the real prompt and the real
# model, against a throwaway Postgres + redis. Nothing reaches a customer and
# no hub order is created. Needs the ANTHROPIC_API_KEY repository secret;
# without it the job stops with a clear message. Manual only.

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # A model-in-the-loop pass over 120 cases × 3 is hours, not minutes: the
    # first run (2026-11-06) was killed at 30 min with no record written.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neema
          POSTGRES_PASSWORD: neema
          POSTGRES_DB: neema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://neema:neema@127.0.0.1:5432/neema
      DATABASE_URL_SYNC: postgresql+psycopg2://neema:neema@127.0.0.1:5432/neema
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-not-a-secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Refuse to run without a key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set as a repository secret — add it under Settings → Secrets, or run the eval on the box."
            exit 1
          fi
      - name: Schema
        run: python -m alembic upgrade head
      # `pipefail`: a crash behind `tee` must fail the step (2026-11-06: both
      # stages died at start-up and the run still reported success).
      - name: Scripted scenarios (the original battery)
        shell: bash
        run: set -o pipefail; python -m app.jobs.agent_eval 2>&1 | tee agent-eval-transcript.txt
      - name: The blind held-out case set, pass^3 (the programme's held-out number)
        shell: bash
        run: |
          set -o pipefail
          python -m app.jobs.agent_eval --cases --file blind_heldout.jsonl --repeat 3 \
            --out agent-eval-blind.json --packet rater-packet.md 2>&1 | tee agent-eval-blind.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-results
          path: |
            apps/api/agent-eval-transcript.txt
            apps/api/agent-eval-blind.json
            apps/api/agent-eval-blind.log
            apps/api/rater-packet.md
