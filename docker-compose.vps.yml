# VPS override — used on the production box together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# The host-level nginx terminates TLS and proxies to these localhost ports,
# so api/web are published on 127.0.0.1 ONLY (never 0.0.0.0 — this box is
# shared and pgAdmin/Postgres/Redis must not face the internet).
#
# Images come from GHCR (built by .github/workflows/deploy.yml on merge to
# main) — the box never builds images itself.

services:
    api:
        image: ghcr.io/mosesmwicigi24-pixel/neema-ai-api:${IMAGE_TAG:-latest}
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            # Owner, 2026-10-05: callers must reach a person at once. Meta's own
            # per-call transcription makes Meta play a spoken notice ("this call
            # will be recorded…") before the call connects, and callers were
            # hanging up during it (62 of 82 inbound calls missed in 30 days).
            # Calls are still recorded in the agent's browser (no announcement)
            # and transcribed by Neema itself. Set here, not in .env, so it is
            # visible and reviewed; compose `environment` beats `env_file`.
            CALL_META_TRANSCRIPTION: "false"
            CALL_META_RECORDING: "false"
            # Instead of the spoken notice: one written line (English + Swahili,
            # wording approved by the owner 2026-10-05), sent once per customer
            # when their first call connects, inside the 24 h window
            # (services/recording_notice.py).
            CALL_RECORDING_NOTICE_ENABLED: "true"
            # Neema hears voice notes and calls (cycles 4-5, 2026-10-05):
            # every inbound voice note (WhatsApp / Messenger / Instagram) and
            # every recorded call is transcribed by services/transcribe.py.
            # The image has no faster-whisper, so production uses OpenAI with
            # the existing OPENAI_API_KEY. gpt-4o-transcribe ≈ $0.006/audio
            # minute (~2 audio-hours/month ≈ $1); the daily ceiling refuses
            # anything past TRANSCRIBE_DAILY_CAP_USD and the team sees why.
            WHISPER_ENABLED: "true"
            WHISPER_AUTO: "true"
            WHISPER_PROVIDER: "openai"
            TRANSCRIBE_MODEL: "gpt-4o-transcribe"
            TRANSCRIBE_DAILY_CAP_USD: "3"
            # Recovery sweeps on a daily timer (services/recovery_jobs.py,
            # 2026-10-10): OFF until the owner has read a sample —
            # GET /api/admin/recovery/preview — and switches a job on here.
            RECOVERY_CART_ENABLED: "false"
            RECOVERY_PAYMENT_ENABLED: "false"
            RECOVERY_REENGAGE_ENABLED: "false"
            RECOVERY_JOBS_DRY_RUN: "false"
            # Quote follow-ups stay OFF until the owner approves the samples.
            QUOTE_FOLLOW_UP_ENABLED: "false"

    web:
        image: ghcr.io/mosesmwicigi24-pixel/neema-ai-web:${IMAGE_TAG:-latest}
        ports:
            - "127.0.0.1:3000:3000"
