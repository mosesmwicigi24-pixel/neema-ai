worker_processes auto;
events { worker_connections 2048; }

http {
    include      mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    sendfile on;
    tcp_nopush on;              # fill packets before sending — fewer round trips

    gzip on;
    # nginx defaults gzip_comp_level to 1 (its weakest). Everything we compress
    # is small text over a long-haul mobile link, so a stronger level is the
    # right trade: ~15% fewer bytes for CPU we are not short of, and static
    # chunks are immutable-cached so each file is compressed rarely.
    gzip_comp_level 6;
    gzip_min_length 256;        # below this the gzip header costs more than it saves
    gzip_vary on;               # correct caching by any proxy in front of us
    gzip_proxied any;
    # text/javascript matters: it is what modern servers label .js (the old
    # application/javascript is deprecated), and an unlisted type silently
    # ships uncompressed.
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/manifest+json
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Use variables so nginx resolves lazily (won't fail if upstream is down at start)
        set $api_upstream http://api:8000;
        set $web_upstream http://web:3000;

        location /api/ {
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Video uploads: raw phone clips up to 150 MB come in, and the api
            # transcodes them to WhatsApp's 16 MB MP4 before replying — both the
            # body cap and the read timeout must cover that.
            client_max_body_size 160m;
            proxy_read_timeout   600s;
        }

        location /ws {
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass         $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}