# XcodeGen spec for the Neema iOS app. `xcodegen generate` writes
# Neema.xcodeproj (not committed). The platform-independent core is the local
# Swift package in NeemaCore/.
name: Neema
options:
  bundleIdPrefix: ke.co.bethanyhouse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NeemaCore:
    path: NeemaCore
  # The WebRTC framework (Google's libwebrtc as an xcframework, stasel/WebRTC):
  # the softphone's peer connection. WebRTCMedia.swift compiles against it.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "155.0.0"
targets:
  Neema:
    type: application
    platform: iOS
    sources:
      - path: NeemaApp
      # The recorded backend's answers (the gallery's fixture set) ride in the
      # Debug app bundle too: `-neema-canned` launches (the UI tests) are served
      # from them. Release leaves them out (configs below).
      - path: NeemaAppTests/Gallery/fixtures.json
        buildPhase: resources
    dependencies:
      - package: NeemaCore
        product: NeemaCore
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.neema
        PRODUCT_NAME: Neema
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The recorded backend's answers are for the UI tests (Debug); the
        # Release app ships without them (CannedBackend compiles to a stub).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: fixtures.json
    info:
      path: NeemaApp/Info.plist
      properties:
        CFBundleDisplayName: Neema
        CFBundleName: Neema
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Neema uses the microphone to take and place WhatsApp and Messenger calls with customers."
        NSCameraUsageDescription: "Neema uses the camera to photograph an item and send it to a customer."
        NSPhotoLibraryUsageDescription: "Neema sends photos and videos you pick to customers."
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: ke.co.bethanyhouse.neema
            CFBundleURLSchemes: [neema]
        UIAppFonts:
          - manrope_regular.ttf
          - manrope_medium.ttf
          - manrope_semibold.ttf
          - manrope_bold.ttf
          - manrope_extrabold.ttf
          - dm_mono_regular.ttf
          - dm_mono_medium.ttf
  NeemaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeemaAppTests
    dependencies:
      - target: Neema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.neema.tests
        GENERATE_INFOPLIST_FILE: YES
  NeemaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeemaAppUITests
    dependencies:
      - target: Neema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.neema.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Neema
schemes:
  Neema:
    build:
      targets:
        Neema: all
        NeemaAppTests: [test]
        NeemaAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeemaAppTests
        - NeemaAppUITests
